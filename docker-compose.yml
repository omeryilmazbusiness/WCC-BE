services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wodi
      POSTGRES_PASSWORD: wodi
      POSTGRES_DB: wodi_crm
    ports:
      - "5432:5432"
    volumes:
      - wodi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wodi -d wodi_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - wodi_minio:/data

volumes:
  wodi_pg:
  wodi_minio:
